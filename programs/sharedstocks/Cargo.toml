[package]
name = "sharedstocks"
version = "0.1.0"
description = "On-chain ownership and randomized allocation rules for SharedStocks packs."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sharedstocks"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
spl-token = "4.0.3"
spl-token-2022 = "3.0.5"
