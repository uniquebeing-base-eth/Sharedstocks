[package]
name = "sharedstocks"
version = "0.1.0"
description = "On-chain ownership and randomized allocation rules for SharedStocks packs."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sharedstocks"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
spl-token = "4.0.3"
spl-token-2022 = "3.0.5"
switchboard-on-demand = { version = "0.13.0", default-features = false, features = ["solana-v2"] }
